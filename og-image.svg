<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2918"/>
      <stop offset="40%" stop-color="#164627"/>
      <stop offset="100%" stop-color="#236b3a"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle organic decorative circles -->
  <circle cx="1100" cy="120" r="280" fill="#2e7d4a" opacity="0.18"/>
  <circle cx="150" cy="580" r="220" fill="#4ade80" opacity="0.08"/>

  <!-- Top Eyebrow Pill -->
  <g transform="translate(100, 90)">
    <rect width="310" height="42" rx="21" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.3"/>
    <text x="24" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#86efac" letter-spacing="1.5">FREE U.S. DONATION GUIDE 2026</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" fill="#ffffff">Where to Donate Garden</text>
  <text x="100" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" fill="#4ade80">Tools &amp; Equipment Near Me</text>

  <!-- Subtitle -->
  <text x="100" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" fill="#d1fae5">
    Find local free drop-off &amp; pickup options by ZIP code. Habitat ReStore, Goodwill &amp; community gardens.
  </text>

  <!-- Feature Cards Row -->
  <g transform="translate(100, 375)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="310" height="150" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" filter="url(#cardShadow)"/>
    <text x="25" y="45" font-size="30">📍</text>
    <text x="68" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">ZIP Code Finder</text>
    <text x="25" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#a7f3d0">Locate verified charities &amp; drop-offs across all 50 states.</text>

    <!-- Card 2 -->
    <rect x="340" y="0" width="310" height="150" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" filter="url(#cardShadow)"/>
    <text x="365" y="45" font-size="30">🚚</text>
    <text x="408" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Free Pickup Guide</text>
    <text x="365" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#a7f3d0">Rules for heavy lawn mowers, tillers &amp; power tools.</text>

    <!-- Card 3 -->
    <rect x="680" y="0" width="320" height="150" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" filter="url(#cardShadow)"/>
    <text x="705" y="45" font-size="30">📊</text>
    <text x="748" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#ffffff">Tax Value Estimator</text>
    <text x="705" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#a7f3d0">Free calculator for fair-market tax deduction values.</text>
  </g>

  <!-- Footer Branding -->
  <text x="100" y="585" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#6ee7b7">🌿 GardenDonate.online</text>
  <text x="1000" y="585" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#a7f3d0">100% Free • No Sign-Up Required</text>
</svg>
